name: Saqib Pool Pro APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare project
        run: |
          mkdir -p app/src/main/java/com/saqib/poolpro
          mkdir -p app/src/main
          mv MainActivity.java app/src/main/java/com/saqib/poolpro/
          mv AndroidManifest.xml app/src/main/

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.saqib.poolpro'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.saqib.poolpro'
                  minSdk 23
                  targetSdk 28
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Saqib-Pool-Pro
          path: app/build/outputs/apk/debug/app-debug.apk
